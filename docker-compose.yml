services:
  postgres:
    image: postgres:17
    container_name: cotriflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cotriflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cotriflow_pgdata:/var/lib/postgresql/data
volumes:
  cotriflow_pgdata:
